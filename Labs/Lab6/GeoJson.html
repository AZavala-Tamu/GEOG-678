<!DOCTYPE html>
<html>
<head>
    <title>TAMU GeoJSON Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.1/dist/leaflet.css"/>

    <style>
        #map {
            width: 800px;
            height: 600px;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- 1.  GeoJSON data file -->
    <script src="tamubuilding.js"></script>

    <script src="https://unpkg.com/leaflet@1.3.1/dist/leaflet.js"></script>

    <script>
   
        var map = L.map('map').setView([30.6, -96.3], 15);

        // Tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
           maxZoom: 19,
           attribution: '&copy; OpenStreetMap'
        }).addTo(map);
       
        L.geoJSON(tamu).addTo(map);

    </script>

</body>
</html>
