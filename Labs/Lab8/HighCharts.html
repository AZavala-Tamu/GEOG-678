<!DOCTYPE html>
<html>
<head>
  <title>College Station Temperature - Highcharts</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highcharts/10.3.3/highcharts.js"></script>

  <style>
    #container {
      min-width: 310px;
      max-width: 900px;
      height: 450px;
      margin: 0 auto;
    }
  </style>
</head>

<body>

<h3 style="text-align:center;">College Station Weekly Temperature Forecast</h3>

<div id="container"></div>

<script>
Highcharts.chart('container', {

  title: { text: 'Weekly Temperature Forecast (College Station)' },

  xAxis: {
    categories: ['Sat','Sun','Mon','Tue','Wed','Thu','Fri','Sat']
  },

  yAxis: {
    title: { text: 'Temperature (°F)' }
  },

  series: [{
    name: 'Highest',
    data: [82, 81, 81, 70, 77, 78, 79, 80]
  }, {
    name: 'Lowest',
    data: [67, 59, 50, 47, 51, 60, 66, 66]
  }]

});
</script>

</body>
</html>
