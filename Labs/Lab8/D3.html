<!DOCTYPE html>
<html>
  <head>
    <title>College Station Temperature - D3</title>
    <script src="https://d3js.org/d3.v4.min.js"></script>

    <style>
      #chart div {
        font: 10px sans-serif;
        background-color: steelblue;
        text-align: right;
        padding: 3px;
        margin: 1px;
        color: white;
      }
    </style>
  </head>

  <body>
    <h3> College Station Temp Forecast</h3>

    <div id="chart"></div>

    <script>
      var data = [82, 81, 81, 70, 77, 78, 79, 80];

      d3.select("#chart")
        .selectAll("div")
        .data(data)
        .enter()
        .append("div")
        .style("width", function(d) { return d + "px"; })
        .text(function(d) { return d; });
    </script>

  </body>
</html>
